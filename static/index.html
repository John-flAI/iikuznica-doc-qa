<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ДокИИ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app panel-closed" id="app">
  <main class="chat">
    <header class="chat-head">
      <div class="head-row">
        <div class="head-note">
          <h1>ДокИИ</h1>
          <p class="limit-note" id="limit-note">Демонстрационный стенд ответов по регламенту: до 60 вопросов в час с одного IP.</p>
        </div>
        <details class="examples-drop" id="examples-drop" hidden>
          <summary>Тестовые вопросы</summary>
          <div class="examples" id="examples"></div>
        </details>
      </div>
      <div class="chat-tabs" id="chat-tabs"></div>
      <div class="theme-tabs" id="theme-tabs" title="Тема оформления">
        <span class="theme-label">Тема:</span>
        <button class="theme-chip active" data-theme="steel" type="button">Сталь</button>
        <button class="theme-chip" data-theme="graphite" type="button">Графит</button>
      </div>
    </header>
    <section class="messages" id="messages" aria-live="polite"></section>
    <div class="thinking" id="thinking" hidden>
      <div class="bar"></div>
      <div class="steps" id="thinking-steps"></div>
    </div>
    <footer class="composer">
      <form class="ask" id="ask-form">
        <textarea id="ask-input" rows="1" placeholder="Задайте вопрос по регламентам…"></textarea>
        <button class="primary" id="ask-send" type="submit">Спросить</button>
      </form>
    </footer>
  </main>
  <button class="rail" id="rail" type="button" title="Служба качества, документы, статистика и настройки">
    <span class="rail-arrow">◂</span>
    <span class="rail-label">Служба качества · Документы · Статистика · Настройки</span>
  </button>
  <aside class="panel" id="panel">
    <button class="panel-collapse" id="panel-collapse" type="button" title="Свернуть колонну">▸</button>
    <nav class="tabs">
      <button class="tab active" type="button" data-tab="qc">Служба качества</button>
      <button class="tab" type="button" data-tab="docs">Документы</button>
      <button class="tab" type="button" data-tab="stats">Статистика</button>
      <button class="tab" type="button" data-tab="settings" id="tab-settings-button" hidden>Настройки</button>
      <button class="tab close" id="panel-close" type="button" title="Свернуть">▸</button>
    </nav>
    <section class="tab-body active" id="tab-qc">
      <div class="qc-list" id="qc-list"></div>
      <div id="qc-detail"></div>
      <div class="weekly">
        <button class="ghost" id="weekly" type="button">Отчёт за неделю</button>
        <pre id="weekly-out" hidden></pre>
      </div>
    </section>
    <section class="tab-body" id="tab-docs">
      <div class="doc-pick" id="doc-pick"></div>
      <div class="doc" id="doc"></div>
    </section>
    <section class="tab-body" id="tab-stats"></section>
    <section class="tab-body" id="tab-settings">
      <h2 class="settings-title">Модель</h2>
      <p class="settings-note">Модель, которая отвечает на вопросы. Выбор действует сразу во всех чатах и запоминается в браузере.</p>
      <div class="model-tabs" id="model-switch" role="radiogroup" aria-label="Модель, которая отвечает на вопросы"></div>
    </section>
  </aside>
</div>
<svg class="flight" id="flight"><path id="flight-path" d=""/><circle class="fly-dot" id="fly-dot" r="5"/></svg>
<script src="/static/app.js"></script>
</body>
</html>
